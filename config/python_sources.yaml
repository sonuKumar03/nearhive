version: 1

# OpenStreetMap Overpass source for live spatial tech company discovery
osm:
  enabled: true
  endpoints:
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
    - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"

# Public Greenhouse ATS boards for job discovery and company enrichment
greenhouse:
  - board_token: "canonical"
    company_name: "Canonical"
    company_domain: "canonical.com"
  - board_token: "cloudflare"
    company_name: "Cloudflare"
    company_domain: "cloudflare.com"

# Public directory sources can be added here with real endpoints:
directories: []
