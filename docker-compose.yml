services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: nearhive-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nearhive
    ports:
      - "5432:5432"
    volumes:
      - nearhive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nearhive"]
      interval: 4s
      timeout: 4s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nearhive-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nearhive?sslmode=disable
      PORT: 8080
      JWT_SECRET: nearhive-dev-local-secret-32-chars-min!
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "*"
      DISCOVERY_WORKER_TOKEN: dev-worker-token
      LOG_LEVEL: info
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: nearhive-crawler
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nearhive?sslmode=disable
      JWT_SECRET: nearhive-dev-local-secret-32-chars-min!
      CRAWLER_CONCURRENCY: 3
      ENVIRONMENT: development
      LOG_LEVEL: info
    restart: unless-stopped

  python-discovery:
    build:
      context: ./python-discovery
      dockerfile: Dockerfile
    container_name: nearhive-discovery
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nearhive?sslmode=disable
      NEARHIVE_API_URL: http://app:8080
      NEARHIVE_WORKER_TOKEN: dev-worker-token
      DISCOVERY_WORKER_TOKEN: dev-worker-token
      LOG_LEVEL: info
    volumes:
      - ./config:/app/config:ro
      - ./python-discovery/nearhive_discovery:/app/nearhive_discovery:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: nearhive-web
    depends_on:
      - app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_URL: http://app:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  nearhive_pgdata:
    name: nearhive_pgdata
