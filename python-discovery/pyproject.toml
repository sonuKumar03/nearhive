[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nearhive-discovery"
version = "0.1.0"
description = "NearHive Python discovery worker, contracts, and queue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.11.0",
    "scrapy-playwright>=0.0.34",
    "playwright>=1.40.0",
    "psycopg[binary,pool]>=3.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
