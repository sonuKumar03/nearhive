<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Careers at CloudScale Systems</title>
  <!-- Block 1: Valid remote JobPosting with structured address, geo, and PropertyValue identifier -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "Senior Backend Engineer",
    "identifier": {
      "@type": "PropertyValue",
      "name": "CloudScale",
      "value": "JOB-1024"
    },
    "url": "https://cloudscale.example.com/jobs/senior-backend-engineer",
    "datePosted": "2026-09-25T10:00:00Z",
    "jobLocationType": "TELECOMMUTE",
    "description": "<p>We are looking for a <strong>Senior Backend Engineer</strong> to scale our distributed systems using Go and Python.</p>",
    "hiringOrganization": {
      "@type": "Organization",
      "name": "CloudScale Systems",
      "url": "https://cloudscale.example.com"
    },
    "jobLocation": {
      "@type": "Place",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "500 Main St",
        "addressLocality": "Austin",
        "addressRegion": "TX",
        "postalCode": "78701",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 30.2680,
        "longitude": -97.7440
      }
    }
  }
  </script>

  <!-- Block 2: Corrupted JSON-LD that should be skipped -->

</head>
