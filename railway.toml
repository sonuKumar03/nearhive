[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"
watchPatterns = [
  "cmd/**",
  "internal/**",
  "migrations/**",
  "config/**",
  "go.mod",
  "go.sum",
  "Dockerfile"
]

[deploy]
startCommand = "nearhive serve"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[service]
internalPort = 8080
