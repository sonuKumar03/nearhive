[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"
watchPatterns = [
  "**",
  "!**/*.md",
  "!docs/**",
  "!Makefile",
  "!docker-compose.yml",
  "!.github/**",
  "!.gitignore",
  "!.dockerignore"
]

[deploy]
startCommand = "nearhive serve"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[service]
internalPort = 8080
